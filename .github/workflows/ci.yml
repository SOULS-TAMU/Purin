name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Ruff and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python -m ruff format --check src tests .github/scripts
      - run: python -m ruff check --select F,E9 src tests .github/scripts
      - run: python -m compileall -q src tests .github/scripts

  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / JAX ${{ matrix.jax }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PIP_CONSTRAINT: ${{ matrix.jax == 'baseline' && format('{0}/.github/constraints/jax-baseline.txt', github.workspace) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        jax: [current]
        include:
          - os: ubuntu-latest
            python: '3.12'
            jax: baseline
          - os: windows-latest
            python: '3.12'
            jax: baseline
          - os: macos-latest
            python: '3.12'
            jax: baseline
          - os: ubuntu-24.04-arm
            python: '3.13'
            jax: current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pip check
      - name: Record runtime configuration
        run: python .github/scripts/environment.py
      - name: Store runtime configuration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: environment-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.jax }}
          path: ci-environment.json
          if-no-files-found: error
          retention-days: 14
      - name: Tests and branch coverage
        run: python -m pytest -q  --cov=purin --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json
      - name: Store coverage reports
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.jax == 'current'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
          retention-days: 14

  package:
    name: Build and install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and validate metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install wheel and check imports
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -I -c "from importlib.metadata import version; import purin; assert purin.__version__ == version('purin')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Publish measured coverage
    needs: [quality, tests, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage
          path: coverage-input
      - run: python .github/scripts/coverage_report.py coverage-input/coverage.json coverage-site
      - name: Publish badge and report on a separate branch
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: codex/coverage
          publish_dir: coverage-site
          commit_message: Update measured coverage
