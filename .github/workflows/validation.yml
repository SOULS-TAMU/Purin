name: Validation

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * 1'

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg

defaults:
  run:
    shell: bash

jobs:
  release-consistency:
    name: Release metadata and artifact policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: SOULS-TAMU/Ohagi/.github/actions/release-check@0bec7e86f5e26a2afa0ae8326aaf252cff2fe50c

  api:
    name: Public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python .github/scripts/api_contract.py

  numerical:
    name: Fixed numerical and gradient references
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install candidate and dependencies
        run: |
          python -m pip install ".[test]"
          python -m pip check
      - run: python .github/scripts/numerical_regression.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: numerical-references
          path: numerical-results.json
          if-no-files-found: error

  quality:
    name: Complexity, duplication, types and dependency boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: SOULS-TAMU/Ohagi/.github/actions/structural-metrics@bdd278e9633990e879c5fdefc0c4da2fa5d47298
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: code-quality-metrics
          path: |
            quality-results.json
            quality-duplication/jscpd-report.json
          if-no-files-found: error

  documentation:
    name: Local links, citations and HTML documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install documentation tools and actual package
        run: |
          python -m pip install -r .github/validation/requirements.txt -r docs/requirements.txt
          python -m pip install .
      - run: python .github/scripts/documentation.py
      - run: python .github/scripts/documentation_examples.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documentation-preview
          path: |
            site
            documentation-results.json
          if-no-files-found: error

  external-links:
    name: External documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-concurrency 4 --max-retries 5 --retry-wait-time 3 --timeout 60
            --exclude '^https://img.shields.io/'
            --exclude '^https://github.com/.*/actions/'
            --accept '200..=299,429'
            README.md CONTRIBUTING.md CHANGELOG.md
          fail: true

  performance:
    name: Same-run performance comparison (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install identical dependencies for both measurements
        run: |
          python -m pip install ".[test]"
      - name: Check out the comparison source without executing its workflows
        run: |
          [[ "$BASE_REF" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach validation-base "$BASE_REF"
      - name: Measure base source
        run: python .github/scripts/performance.py --source validation-base --output performance-base.json
      - name: Measure candidate and report ratios
        run: python .github/scripts/performance.py --output performance-results.json --compare performance-base.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: performance-observations
          path: |
            performance-base.json
            performance-results.json
          retention-days: 90
          if-no-files-found: error

  frontend-integration:
    name: Published frontend integration / ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        framework: [kkthn, daehn, nlpoptnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SOULS-TAMU/Ohagi
          ref: b0a6b3c81f9d4e1d7dbb355eb841b444b29bf241
          path: integration-consumer
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install published consumers and candidate PURIN
        run: |
          python -m pip install "ohagi[nlpoptnet,plotting]==1.0.0"
          python -m pip install --no-deps --force-reinstall .
          python -m pip install --no-deps --index-url https://pypi.org/simple/ "kkt-hardnet==2.0.0" "daehn==2.0.0"
          python -m pip install --no-deps integration-consumer/.github/fixtures/frontends/nlpoptnet
          python -m pip check
      - name: Short training and metadata inference with candidate PURIN
        run: python integration-consumer/.github/scripts/frontend_integration.py "${{ matrix.framework }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-${{ matrix.framework }}
          path: integration-consumer/integration-${{ matrix.framework }}.json
          if-no-files-found: error
