name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * 1'

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg

defaults:
  run:
    shell: bash

jobs:
  api:
    name: Public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python .github/scripts/api_contract.py

  numerical:
    name: Fixed numerical and gradient references
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install candidate and dependencies
        run: |
          python -m pip install ".[test]"
          python -m pip check
      - run: python .github/scripts/numerical_regression.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: numerical-references
          path: numerical-results.json
          if-no-files-found: error

  quality:
    name: Complexity, duplication, types and dependency boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r .github/validation/requirements.txt
      - name: Measure exact duplicated blocks
        run: npx --yes jscpd@5.4.2 --reporters json --output quality-duplication --min-tokens 80 --min-lines 6 --silent src
      - name: Reject new quality regressions
        run: python .github/scripts/quality_metrics.py quality-duplication/jscpd-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: code-quality-metrics
          path: |
            quality-results.json
            quality-duplication/jscpd-report.json
          if-no-files-found: error

  documentation:
    name: Local links, citations and HTML documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/validation/requirements.txt
      - run: python .github/scripts/documentation.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documentation-preview
          path: |
            site
            documentation-results.json
          if-no-files-found: error

  external-links:
    name: External documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 2 --timeout 30
            --exclude '^https://img.shields.io/'
            --exclude '^https://github.com/.*/actions/'
            --accept '200..=299,429'
            README.md CONTRIBUTING.md CHANGELOG.md
          fail: true

  performance:
    name: Same-run performance comparison (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install identical dependencies for both measurements
        run: |
          python -m pip install ".[test]"
      - name: Check out the comparison source without executing its workflows
        run: |
          [[ "$BASE_REF" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach validation-base "$BASE_REF"
      - name: Measure base source
        run: python .github/scripts/performance.py --source validation-base --output performance-base.json
      - name: Measure candidate and report ratios
        run: python .github/scripts/performance.py --output performance-results.json --compare performance-base.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: performance-observations
          path: |
            performance-base.json
            performance-results.json
          retention-days: 90
          if-no-files-found: error

  frontend-integration:
    name: Frozen frontend integration / ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        framework: [kkthn, daehn, nlpoptnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SOULS-TAMU/Ohagi
          ref: e28f687e840d6840b259e687323029c3cc49bd59
          path: integration-consumer
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install consumer, candidate PURIN and frozen frontends
        run: |
          python -m pip install "purin @ git+https://github.com/SOULS-TAMU/Purin.git@40f7a261a3d791b78bdedbdf80770d0daf909740"
          python -m pip install "./integration-consumer[test,flax,orbax,optax,plotting]"
          python -m pip install --no-deps .
          python -m pip install --no-deps integration-consumer/.github/fixtures/frontends/{kkthn,daehn,nlpoptnet}
          python -m pip check
      - name: Short training and metadata inference with candidate PURIN
        run: python integration-consumer/.github/scripts/frontend_integration.py "${{ matrix.framework }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-${{ matrix.framework }}
          path: integration-consumer/integration-${{ matrix.framework }}.json
          if-no-files-found: error
