[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purin"
version = "0.1.0"
description = "Differentiable constrained projections and sparse numerical kernels in JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "numpy>=1.26", "scipy>=1.11"]

license = "Apache-2.0"
license-files = ["LICENSE*", "NOTICE"]
authors = [{name = "SOULS-TAMU contributors"}]
keywords = ["jax", "constrained-learning", "differentiable-optimization"]

[project.urls]
Homepage = "https://github.com/SOULS-TAMU/Purin"
Repository = "https://github.com/SOULS-TAMU/Purin"
Issues = "https://github.com/SOULS-TAMU/Purin/issues"
Changelog = "https://github.com/SOULS-TAMU/Purin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
build = ["build>=1", "twine>=5"]
cuda12 = ["jax[cuda12]>=0.4.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"
